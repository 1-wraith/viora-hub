<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="topFace" x1="64" y1="16" x2="64" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="20" y1="46" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="64" y1="46" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="64" y1="36" x2="64" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="42" fill="#06B6D4" opacity="0.15" filter="url(#glow)"/>

  <!-- Minecraft Isometric Block -->
  <!-- Top Face -->
  <polygon points="64,16 108,42 64,68 20,42" fill="url(#topFace)"/>
  <polygon points="64,22 98,42 64,62 30,42" fill="#22D3EE" opacity="0.5"/>

  <!-- Left Face -->
  <polygon points="20,42 64,68 64,112 20,86" fill="url(#leftFace)"/>
  <polygon points="26,48 58,68 58,104 26,84" fill="#0EA5E9" opacity="0.12"/>

  <!-- Right Face -->
  <polygon points="64,68 108,42 108,86 64,112" fill="url(#rightFace)"/>
  <polygon points="70,68 102,48 102,84 70,104" fill="#6366F1" opacity="0.15"/>

  <!-- Center Viora Rune (V Emblem) -->
  <path d="M46 48L64 86L82 48H72L64 68L56 48H46Z" fill="url(#emeraldGlow)"/>

  <!-- Pixel Grid Lines (Minecraft Texture Accent) -->
  <line x1="64" y1="16" x2="64" y2="68" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="20" y1="42" x2="64" y2="68" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="108" y1="42" x2="64" y2="68" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="64" y1="68" x2="64" y2="112" stroke="#000000" stroke-opacity="0.4" stroke-width="2"/>
</svg>
